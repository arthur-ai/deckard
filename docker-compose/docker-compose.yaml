name: arthur-deckard

# The password of the Elasticsearch beside Deckard: for `elastic` (you, with curl), the
# `deckard` user the example config sends as, and the `deckard_viewer` user the viewer reads
# as. Set it in .env.
x-elastic-password: &elastic-password ${ELASTIC_PASSWORD:-changeme}
x-elastic-image: &elastic-image docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.5.5}

services:
  deckard:
    image: arthurplatform/deckard:${DECKARD_VERSION-0.2.2}
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # Longer than the engine's own 15s wait for running scans, so a scan that finishes
    # inside it gets to report its outcome before the container is killed.
    stop_grace_period: "30s"
    env_file:
      - path: .env
        required: false
    environment:
      ML_ENGINE_DISCOVERY_CONFIG: /etc/deckard/discovery.yaml
      ELASTIC_PASSWORD: *elastic-password
      # The API the viewer's Scan now buttons call, on port 7494 inside this network only,
      # for whoever holds the token control-token wrote.
      ML_ENGINE_CONTROL_TOKEN_FILE: /etc/deckard/control/token
    volumes:
      - ./discovery.yaml:/etc/deckard/discovery.yaml:ro
      # Files the config reads with {file: secrets/...}, resolved beside the config.
      - ./secrets:/etc/deckard/secrets:ro
      # This machine's scan, written by ./scan-local.sh (scan-local.ps1 on Windows), for the `local` source.
      - ./local-scan:/etc/deckard/local-scan:ro
      - control:/etc/deckard/control:ro
    depends_on:
      # So the scan at startup has a user to send as.
      elastic-setup:
        condition: service_completed_successfully
      control-token:
        condition: service_completed_successfully
    healthcheck:
      test: wget -qO - http://127.0.0.1:7492/health
      interval: 30s
      timeout: 5s
      retries: 5

  # Where the example config sends events. Browse them in the viewer, below.
  elasticsearch:
    image: *elastic-image
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: *elastic-password
      xpack.security.enabled: "true"
      # Plain HTTP, on Compose's private network and this machine's loopback only.
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      # A local demo on one node: a disk over 90% full (by Elasticsearch's count, size minus
      # available) would otherwise leave its indices unassigned and the setup failing, and
      # memory-mapped files would need the host's vm.max_map_count raised, which takes root.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      node.store.allow_mmap: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - 127.0.0.1:9200:9200
    healthcheck:
      # Up once security answers, even if only to refuse: setup.sh says why a password is
      # wrong. `/` answers first, while the security index is still being created and
      # security calls get 503.
      test: curl -s -o /dev/null -w '%{http_code}' -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200/_security/_authenticate | grep -qE '^(200|401)$$'
      interval: 5s
      timeout: 5s
      retries: 60

  # http://localhost:7493: the AI agents Deckard found, and how its scans went. Plain Node
  # running ./viewer, which reads Deckard's events from Elasticsearch over its REST API as
  # a user that can only read them. Listens on this machine only, with no login.
  viewer:
    image: node:24.22.1-alpine
    # You, so it can edit discovery.yaml and secrets/, in Deckard's group, so Deckard can
    # read the secret files it writes there without anyone else being able to.
    user: "${VIEWER_UID:-1000}:65532"
    restart: unless-stopped
    read_only: true
    working_dir: /viewer
    command: ["node", "server.mjs"]
    environment:
      # Or your own Elasticsearch, once Deckard sends there: set VIEWER_ES_URL and
      # VIEWER_ES_API_KEY in .env (a key that can read logs-arthur.discovery-*).
      ES_URL: ${VIEWER_ES_URL:-http://elasticsearch:9200}
      ES_API_KEY: ${VIEWER_ES_API_KEY:-}
      ES_USERNAME: deckard_viewer
      ES_PASSWORD: *elastic-password
      # Where Scan now asks Deckard to scan a source.
      DECKARD_URL: http://deckard:7494
      DECKARD_CONTROL_TOKEN_FILE: /control/token
      # Where Add source writes: the discovery.yaml and secrets/ Deckard reads, which it
      # watches and applies within seconds.
      SOURCES_CONFIG: /deckard/discovery.yaml
      SOURCES_SECRETS: /deckard/secrets
    volumes:
      - ./viewer:/viewer:ro
      - control:/control:ro
      # Writable: the viewer edits these.
      - ./discovery.yaml:/deckard/discovery.yaml
      - ./secrets:/deckard/secrets
    ports:
      - 127.0.0.1:7493:7493
    depends_on:
      elastic-setup:
        condition: service_completed_successfully
      control-token:
        condition: service_completed_successfully
    healthcheck:
      # Up once Elasticsearch answers the viewer's user.
      test: wget -qO /dev/null http://127.0.0.1:7493/api/health
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: the users Deckard sends as and the viewer reads as, each allowed only that.
  elastic-setup:
    image: *elastic-image
    command: ["sh", "/setup/setup.sh"]
    environment:
      ELASTIC_PASSWORD: *elastic-password
    volumes:
      - ./elastic:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # One-shot: the token the viewer shows Deckard to ask for a scan, made once and kept in
  # the control volume, which only Deckard and the viewer mount.
  control-token:
    image: node:24.22.1-alpine
    read_only: true
    command:
      - sh
      - -c
      - '[ -s /control/token ] || { umask 022; od -An -N32 -tx1 /dev/urandom | tr -d " \n" > /control/token; }'
    volumes:
      - control:/control

volumes:
  elasticsearch-data:
  control:
