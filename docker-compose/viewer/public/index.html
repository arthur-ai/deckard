<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deckard</title>
  <link rel="icon" href="/owl.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/owl.svg" alt="" width="31" height="32">
      <div>
        <h1>Deckard</h1>
        <p class="muted">AI agents found across your sources</p>
      </div>
    </div>
    <div class="refresh">
      <span id="updated" class="muted"></span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>
    <section id="stats" class="stats" aria-label="Summary"></section>
    <section id="attention" class="attention" aria-label="Needs attention" hidden></section>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-agents" data-tab="agents" aria-selected="true">Agents <span class="count" id="count-agents"></span></button>
      <button role="tab" id="tab-sources" data-tab="sources" aria-selected="false">Sources <span class="count" id="count-sources"></span></button>
    </nav>

    <section id="panel-agents" role="tabpanel" aria-labelledby="tab-agents">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search name, path, host, ID…" aria-label="Search agents">
        <div class="segmented" role="group" aria-label="Status">
          <button type="button" data-status="current" aria-pressed="true">Current</button>
          <button type="button" data-status="gone" aria-pressed="false">No longer reported</button>
          <button type="button" data-status="all" aria-pressed="false">All</button>
        </div>
        <select id="filter-kind" aria-label="Kind"><option value="">Every kind</option></select>
        <select id="filter-source" aria-label="Source"><option value="">Every source</option></select>
      </div>
      <div class="table-wrap">
        <table class="agents">
          <thead>
            <tr>
              <th data-sort="name" aria-sort="ascending">Agent</th>
              <th data-sort="kind">Kind</th>
              <th data-sort="where">Where</th>
              <th data-sort="runs_on">Runs on</th>
              <th data-sort="source">Source</th>
              <th data-sort="first_seen">First seen</th>
              <th data-sort="last_seen">Last seen</th>
            </tr>
          </thead>
          <tbody id="agents-body"></tbody>
        </table>
      </div>
      <p id="agents-empty" class="empty" hidden></p>
    </section>

    <section id="panel-sources" role="tabpanel" aria-labelledby="tab-sources" hidden>
      <div id="sources-list" class="sources"></div>
      <p id="sources-empty" class="empty" hidden></p>
    </section>
  </main>

  <aside id="drawer" class="drawer" hidden aria-label="Agent details">
    <div class="drawer-head">
      <div>
        <h2 id="drawer-title"></h2>
        <div id="drawer-badges" class="badges"></div>
      </div>
      <button id="drawer-close" type="button" aria-label="Close">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
</body>
</html>
